# Type-check and production build on every push and pull request.
#
# No real secrets here. The build only needs env vars to exist, and to hold
# values that are shaped right; nothing is contacted at build time, because
# every page that reads the database is force-dynamic. getCatalog refuses to
# serve the seed in production without DATABASE_URL, which is why a dummy is
# set -- it is never connected to during the build.
name: CI
on:
  push:
    branches: [main, "migrate/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_SITE_URL: https://murrelet.co.uk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
