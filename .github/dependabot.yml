# Dependency updates. Minor and patch bumps arrive as one grouped PR a week;
# CI (.github/workflows/ci.yml) type-checks and builds each one before merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # No npm MAJOR versions as weekly PRs -- each is a deliberate project.
      # The first batch (2026-09-28) showed why: TypeScript 7 failed CI;
      # Stripe 16 -> 22 is the payment and webhook path, where a green build
      # proves only that it compiles; @types/node 26 describes a Node newer
      # than the Node 22 we run; and Next majors are pinned by the Cloudflare
      # adapter.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
